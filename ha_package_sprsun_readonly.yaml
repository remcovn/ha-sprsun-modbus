      - if:
          - condition: template
            value_template: "{{ unit_mode_raw not in ['unknown', 'unavailable', 'none', ''] }}"
        then:
          - service: input_select.select_option
            target:
              entity_id: input_select.sprsun_unit_mode
            data:
              option: >
                {% set v = unit_mode_raw | int(-1) %}
                {% if v == 0 %}DHW
                {% elif v == 1 %}Heating
                {% elif v == 2 %}Cooling
                {% elif v == 3 %}Heating + DHW
                {% elif v == 4 %}Cooling + DHW
                {% else %}DHW
                {% endif %}

  - id: sprsun_write_hot_water_setpoint
    alias: SPRSUN - Write hot water setpoint (reg 202)
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.sprsun_hot_water_setpoint
    condition:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.from_state is not none and trigger.to_state.state != trigger.from_state.state }}"
    action:
      - service: modbus.write_register
        data:
          hub: sprsun
          slave: 1
          address: 202
          value: "{{ (trigger.to_state.state | float * 2) | round(0) | int }}"

