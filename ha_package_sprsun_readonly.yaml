        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "min"
        state_class: measurement
        scan_interval: 60

      - name: Comp Delay (G06)
        slave: 1
        address: 386
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "min"
        state_class: measurement
        scan_interval: 60

      - name: Hot Water Heater Ext (G07)
        slave: 1
        address: 387
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Heating Heater Ext (G05)
        slave: 1
        address: 388
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Start Internal (G03)
        slave: 1
        address: 389
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "min"
        state_class: measurement
        scan_interval: 60

      - name: DC Pump Scale Factor (F18)
        slave: 1
        address: 395
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 60

      - name: DC Pump Diff (F19)
        slave: 1
        address: 396
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 60

      - name: Delta Temp Set (G04)
        slave: 1
        address: 397
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Comp Freq Diff (F22)
        slave: 1
        address: 399
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 60

      - name: Enable Switch Amb Linkage (G09)
        slave: 1
        address: 401
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 60

      - name: Ambient Temp Switch Setpoint (G10)
        slave: 1
        address: 402
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Ambient Temp Diff (G11)
        slave: 1
        address: 403
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Limit Freq Temp Diff (F27)
        slave: 1
        address: 404
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Decrease Freq Temp Diff (F28)
        slave: 1
        address: 405
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Limit Freq Outlet Low (F29)
        slave: 1
        address: 406
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Decrease Freq Outlet Low (F30)
        slave: 1
        address: 407
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Limit Freq Outlet High (F31)
        slave: 1
        address: 408
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Decrease Freq Outlet High (F32)
        slave: 1
        address: 409
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Antifreeze Cycle (F35)
        slave: 1
        address: 415
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "min"
        state_class: measurement
        scan_interval: 30

      - name: Three-way Valve Cycle (F36)
        slave: 1
        address: 416
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "hour"
        state_class: measurement
        scan_interval: 30

      - name: Pump Cycle In Error (F37)
        slave: 1
        address: 417
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "min"
        state_class: measurement
        scan_interval: 30

      - name: Comp Freq Cycle (F38)
        slave: 1
        address: 418
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "s"
        state_class: measurement
        scan_interval: 30

      - name: Air Too Low Setpoint (F41)
        slave: 1
        address: 419
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      - name: High Pressure Adjust (F47)
        slave: 1
        address: 434
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 60

      - name: Low Pressure Adjust (F48)
        slave: 1
        address: 435
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 60

      - name: Air Too Low Diff (F51)
        slave: 1
        address: 436
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Outlet Temp Offset Setpoint (F53)
        slave: 1
        address: 438
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Outlet Temp Offset (F52)
        slave: 1
        address: 439
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Heat Upper Limit Setpoint (F54)
        slave: 1
        address: 440
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Cool Lower Limit Setpoint (F55)
        slave: 1
        address: 441
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Model Selection (F56)
        slave: 1
        address: 442
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 300

      # ---------------------------------------------------------------------
      # Diagnostic/status fields (interpretation may vary by firmware)
      # ---------------------------------------------------------------------
      - name: Status Field A
        slave: 1
        address: 209
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 15

      - name: Protection Code
        slave: 1
        address: 210
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 15

      - name: Suction Superheat
        slave: 1
        address: 211
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "K"
        state_class: measurement
        scan_interval: 15

      - name: Defrost Field 1
        slave: 1
        address: 215
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 30

      - name: Defrost Field 2
        slave: 1
        address: 216
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 30

      - name: Defrost Field 3
        slave: 1
        address: 217
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 30

      # ---------------------------------------------------------------------
      # Firmware IDs
      # ---------------------------------------------------------------------
      - name: Controller Version
        slave: 1
        address: 44
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 120

      - name: Display Version
        slave: 1
        address: 45
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 120

template:
  - sensor:
      - name: Unit Mode (P06) Text
        icon: mdi:hvac
        state: >
          {% set raw = states.sensor
            | selectattr('name', 'eq', 'Unit Mode (P06)')
            | map(attribute='state')
            | first %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] %}
            unknown
          {% else %}
            {% set v = raw | int(-1) %}
            {% if v == 0 %}DHW
            {% elif v == 1 %}Heating
            {% elif v == 2 %}Cooling
            {% elif v == 3 %}Heating + DHW
            {% elif v == 4 %}Cooling + DHW
            {% else %}Unknown ({{ raw }})
            {% endif %}
          {% endif %}

      - name: Pump Work Mode (G02) Text
        icon: mdi:pump
        state: >
          {% set raw = states.sensor
            | selectattr('name', 'eq', 'Pump Work Mode (G02)')
            | map(attribute='state')
            | first %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] %}
            unknown
          {% else %}
            {% set v = raw | int(-1) %}
            {% if v == 0 %}Interval
            {% elif v == 1 %}Normal
            {% elif v == 2 %}Demand
            {% else %}Unknown ({{ raw }})
            {% endif %}
          {% endif %}

      - name: Ambient Linkage Enable (G09) Text
        icon: mdi:link-variant
        state: >
          {% set raw = states.sensor
            | selectattr('name', 'eq', 'Enable Switch Amb Linkage (G09)')
            | map(attribute='state')
            | first %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] %}
            unknown
          {% else %}
            {% set v = raw | int(-1) %}
            {% if v == 0 %}Disabled (No linkage)
            {% elif v == 1 %}Enabled (Ambient linkage)
            {% else %}Unknown ({{ raw }})
            {% endif %}
          {% endif %}

      - name: DC Pump Mode (F13) Text
        icon: mdi:pump
        state: >
          {% set raw = states.sensor
            | selectattr('name', 'eq', 'DC Pump Mode (F13)')
            | map(attribute='state')
            | first %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] %}
            unknown
          {% else %}
            {% set v = raw | int(-1) %}
            {% if v == 0 %}Manual
            {% elif v == 1 %}Auto
            {% else %}Unknown ({{ raw }})
            {% endif %}
          {% endif %}

input_number:
  sprsun_hot_water_setpoint:
    name: SPRSUN Hot Water Setpoint
    min: 30
    max: 60
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
  sprsun_cooling_setpoint:
    name: SPRSUN Cooling Setpoint
    min: 7
    max: 30
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
  sprsun_heating_setpoint:
    name: SPRSUN Heating Setpoint
    min: 20
    max: 55
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
  sprsun_heat_delta_temp:
    name: SPRSUN Heat Delta Temp
    min: 1
    max: 20
    step: 1
    mode: box
    unit_of_measurement: "°C"
  sprsun_ac_constant_temp_diff:
    name: SPRSUN AC Constant Temp Diff
    min: 1
    max: 20
    step: 1
    mode: box
    unit_of_measurement: "°C"
  sprsun_hot_water_delta_temp:
    name: SPRSUN Hot Water Delta Temp
    min: 1
    max: 20
    step: 1
    mode: box
    unit_of_measurement: "°C"

input_select:
  sprsun_unit_mode:
    name: SPRSUN Unit Mode
    options:
      - DHW
      - Heating
      - Cooling
      - Heating + DHW
      - Cooling + DHW

automation:
  - id: sprsun_sync_write_helpers
    alias: SPRSUN - Sync write helpers from Modbus sensors
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/2"
    action:
      - variables:
          hot_water_setpoint: >
            {{ states.sensor | selectattr('name', 'eq', 'Hot Water Setpoint') | map(attribute='state') | first }}
          cooling_setpoint: >
            {{ states.sensor | selectattr('name', 'eq', 'Cooling Setpoint') | map(attribute='state') | first }}
          heating_setpoint: >
            {{ states.sensor | selectattr('name', 'eq', 'Heating Setpoint') | map(attribute='state') | first }}
          heat_delta_temp: >
            {{ states.sensor | selectattr('name', 'eq', 'Heat Delta Temp') | map(attribute='state') | first }}
          ac_const_temp_diff: >
            {{ states.sensor | selectattr('name', 'eq', 'AC Constant Temp Diff') | map(attribute='state') | first }}
          hot_water_delta_temp: >
            {{ states.sensor | selectattr('name', 'eq', 'Hot Water Delta Temp') | map(attribute='state') | first }}
          unit_mode_raw: >
            {{ states.sensor | selectattr('name', 'eq', 'Unit Mode (P06)') | map(attribute='state') | first }}
      - if:
          - condition: template
