  - id: sprsun_write_unit_mode_p06
    alias: SPRSUN - Write unit mode P06 (reg 54)
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.sprsun_unit_mode
    condition:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.from_state is not none and trigger.to_state.state != trigger.from_state.state }}"
      - condition: template
        value_template: >
          {% set f = states.sensor | selectattr('name', 'eq', 'Compressor Frequency') | map(attribute='state') | first %}
          {{ f not in ['unknown', 'unavailable', 'none', ''] and (f | float(0)) <= 0 }}
    action:
      - variables:
          raw_mode: >
            {% if trigger.to_state.state == 'DHW' %}0
            {% elif trigger.to_state.state == 'Heating' %}1
            {% elif trigger.to_state.state == 'Cooling' %}2
            {% elif trigger.to_state.state == 'Heating + DHW' %}3
            {% elif trigger.to_state.state == 'Cooling + DHW' %}4
            {% else %}0
            {% endif %}
      - service: modbus.write_register
        data:
          hub: sprsun
          slave: 1
          address: 54
          value: "{{ raw_mode | int }}"
