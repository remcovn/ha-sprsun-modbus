# Home Assistant package file for SPRSUN read-only Modbus sensors.
#
# Recommended location in Home Assistant:
#   /config/packages/sprsun_readonly.yaml
#
# Then enable packages in configuration.yaml with the snippet from:
#   ha_configuration_packages_snippet.yaml

modbus:
  - name: sprsun
    type: tcp
    host: 192.168.1.50
    port: 8899
    timeout: 5
    delay: 5

    sensors:
      # ---------------------------------------------------------------------
      # Core temperatures (most useful day-to-day)
      # ---------------------------------------------------------------------
      - name: Inlet Temperature
        slave: 1
        address: 14
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Outlet Temperature
        slave: 1
        address: 18
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Ambient Temperature
        slave: 1
        address: 17
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Hot Water Temperature
        slave: 1
        address: 15
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Suction Gas Temperature
        slave: 1
        address: 21
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Coil Temperature
        slave: 1
        address: 22
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Exhaust Temperature
        slave: 1
        address: 27
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Evaporator Temperature
        slave: 1
        address: 40
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      - name: Condenser Temperature
        slave: 1
        address: 41
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15

      # ---------------------------------------------------------------------
      # Pressures
      # ---------------------------------------------------------------------
      - name: Suction Pressure
        slave: 1
        address: 47
        input_type: holding
        data_type: int16
        scale: 0.01
        precision: 2
        unit_of_measurement: "bar"
        state_class: measurement
        scan_interval: 15

      - name: Discharge Pressure
        slave: 1
        address: 48
        input_type: holding
        data_type: int16
        scale: 0.01
        precision: 2
        unit_of_measurement: "bar"
        state_class: measurement
        scan_interval: 15

      # ---------------------------------------------------------------------
      # Actuator/operating indicators (still read-only)
      # ---------------------------------------------------------------------
      - name: EEV1 Opening Step
        slave: 1
        address: 28
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        state_class: measurement
        scan_interval: 15

      - name: Compressor Frequency
        slave: 1
        address: 30
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "Hz"
        state_class: measurement
        scan_interval: 15

      - name: Compressor Current
        slave: 1
        address: 35
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "A"
        state_class: measurement
        scan_interval: 15

      - name: Compressor Target Frequency
        slave: 1
        address: 36
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "Hz"
        state_class: measurement
        scan_interval: 15

      - name: Pump PWM
        slave: 1
        address: 46
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "%"
        state_class: measurement
        scan_interval: 15

      - name: DC Fan 1 Speed
        slave: 1
        address: 38
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "rpm"
        state_class: measurement
        scan_interval: 15

      - name: DC Fan 2 Speed
        slave: 1
        address: 39
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "rpm"
        state_class: measurement
        scan_interval: 15

      # Inverter electrical telemetry.
      # Direct Modbus read showed 333+ is static on this unit; 33-35 are dynamic.
      - name: SPRSUN Input Power
        slave: 1
        address: 33
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 15

      - name: SPRSUN Inverter Voltage
        slave: 1
        address: 34
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 15

      - name: SPRSUN Inverter Current
        slave: 1
        address: 35
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 15

      # ---------------------------------------------------------------------
      # Setpoints and offsets (read-only exposure, no climate control entities)
      # ---------------------------------------------------------------------
      - name: Heating Setpoint
        slave: 1
        address: 204
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: Cooling Setpoint
        slave: 1
        address: 203
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: Hot Water Setpoint
        slave: 1
        address: 202
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: Heat Delta Temp
        slave: 1
        address: 198
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      - name: AC Constant Temp Diff
        slave: 1
        address: 199
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      - name: Hot Water Delta Temp
        slave: 1
        address: 200
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      - name: WT Constant Temp Diff
        slave: 1
        address: 201
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      # ---------------------------------------------------------------------
      # Operational modes and pump tuning (read-only)
      # ---------------------------------------------------------------------
      - name: Unit Mode (P06)
        slave: 1
        address: 54
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 30

      - name: DC Pump Mode (F13)
        slave: 1
        address: 390
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 30

      - name: DC Pump Cycle (F14)
        slave: 1
        address: 391
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "s"
        state_class: measurement
        scan_interval: 30

      - name: DC Pump Freq Set (F15)
        slave: 1
        address: 392
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "%"
        state_class: measurement
        scan_interval: 30

      - name: DC Pump Max Freq (F16)
        slave: 1
        address: 393
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "%"
        state_class: measurement
        scan_interval: 30

      - name: DC Pump Min Freq (F17)
        slave: 1
        address: 394
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "%"
        state_class: measurement
        scan_interval: 30

      - name: Pump Work Mode (G02)
        slave: 1
        address: 398
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        scan_interval: 30

      - name: WT Temp Calibration (F44)
        slave: 1
        address: 205
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Inlet Temp Calibration (F45)
        slave: 1
        address: 206
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Outlet Temp Calibration (F46)
        slave: 1
        address: 207
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: WT Temp Offset Setpoint (F49)
        slave: 1
        address: 208
        input_type: holding
        data_type: int16
        scale: 1
        precision: 0
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      - name: Comp Delay (G08)
        slave: 1
